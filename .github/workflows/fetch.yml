name: Fetch SaiPa ticket data

# Baseline cadence: hourly at :17 (not :00 — GitHub's shared scheduler is
# heavily oversubscribed at the top of the hour). Never gated — this
# workflow always fetches and commits.
#
# GitHub's own scheduler delivers scheduled events unreliably under load
# (documented: can be delayed, or dropped entirely — denser schedules are
# hit harder). Observed directly: 9 of 24 expected hourly runs in the first
# 24h after this cron went live (27.7), gaps 1h35m-3h48m spread through the
# day. An external scheduler now drives the intended cadence via
# repository_dispatch (event type "scrape") instead; this cron is a
# fallback for when that external service is down — see the "External
# trigger" section in README.md/CLAUDE.md for what it is and how to verify
# it's alive. Exactly one baseline cron, deliberately not duplicated as
# redundancy: once the external trigger is reliable, extra crons only mean
# extra full scrapes on days when several happen to coincide.
#
# workflow_dispatch here (not on fetch-intensive.yml) is the one to use for
# an on-demand manual scrape — fetch-intensive.yml's own manual run is
# gated exactly like its scheduled one and does nothing outside a game
# day/watch date.
"on":
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [scrape]

concurrency:
  group: fetch-and-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The branch's CURRENT tip, not the SHA pinned when this run was
          # queued. actions/checkout with no ref checks out github.sha,
          # fixed at run-creation time — a run queued when GitHub's own
          # (occasionally ~30min-late) cron fires can start well after a
          # same-minute external-trigger run has already pushed, do its
          # work on a base that predates that push, then fail to rebase a
          # data commit onto files the other run rewrote line-for-line.
          # github.ref_name, not a hardcoded "main": resolves to the
          # default branch for schedule and repository_dispatch alike
          # (both always run against it — confirmed against GitHub's own
          # docs, not assumed) and to whichever branch/tag a
          # workflow_dispatch run was pointed at, e.g. a feature branch
          # for testing this exact change — hardcoding "main" would
          # silently make those verification runs operate on main instead.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          # Current Active LTS — Node 20 reached end of security support
          # 2026-04-30. Matches package.json's engines.node; also matches
          # the Node 24 runtime the runner already forces every action
          # onto regardless of what an action itself declares, so this and
          # the actions/checkout bump above are the same fix from two
          # sides: our own script's declared runtime and the actions'.
          node-version: "24"

      - name: Fetch ticket data
        id: fetch
        run: node scripts/fetch.js
        continue-on-error: true # so a per-event failure still lets the commit step
        # below preserve whatever other events DID succeed

      - name: Generate share graphic
        id: shareimages
        run: node scripts/generateShareImages.js | tee /dev/stderr | grep '^shareImagesWritten=' >> "$GITHUB_OUTPUT"
        continue-on-error: true # a marketing graphic must never fail the scrape

      - name: Rasterise share graphic to PNG
        if: steps.shareimages.outputs.shareImagesWritten == 'true'
        continue-on-error: true # see scripts/generateShareImages.js: no Chrome means the SVG still commits
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            "$CHROME_BIN" --headless --disable-gpu --no-sandbox --screenshot="$PWD/kuvat/seuraava-ottelu.png" \
              --window-size=1200,630 "file://$PWD/kuvat/seuraava-ottelu.html"
          else
            echo "No Chrome binary found on this runner — leaving the SVG as the freshest asset"
          fi

      - name: Commit and push data changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ kuvat/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ticket data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # $GITHUB_REF_NAME (not a hardcoded "main"): scheduled and
            # repository_dispatch runs always execute on the default
            # branch, so this is "main" in production — but it also means
            # a workflow_dispatch run against a feature branch (e.g. to
            # verify this credential change pre-merge) pulls and pushes
            # that same branch instead of silently rebasing the whole
            # branch onto, and pushing it to, main.
            #
            # KEEP this failing loudly on conflict — do not add automatic
            # conflict resolution for these files (e.g. always taking
            # "ours" or "theirs" because every run regenerates them
            # wholesale). That reasoning is wrong: this run's working copy
            # was built from whatever base its own checkout saw (see the
            # ref: fix on the checkout step above, which closes the one
            # known way that base could already be stale), and a conflict
            # here means the OTHER run's push contains a data point this
            # run's copy never had. Resolving in either direction discards
            # it silently. A red "Commit and push data changes" step that
            # costs one sample is strictly better than a green one that
            # quietly loses a data point. If this conflicts again after
            # the fix above, that's a fault we don't understand yet, and
            # it should stay loud, not get papered over.
            git pull --rebase "$remote" "$GITHUB_REF_NAME"
            git push "$remote" "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Fail the run if fetch.js reported a failure
        if: steps.fetch.outcome == 'failure'
        run: exit 1
